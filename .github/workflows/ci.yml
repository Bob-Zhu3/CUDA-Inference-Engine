name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CudaInferenceEngine/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CudaInferenceEngine/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: docker build -t cuda-inference-frontend .

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cuda-inference-backend ./CudaInferenceEngine

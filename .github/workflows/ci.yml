name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t lstm-inference ./CudaInferenceEngine

    - name: Run Container
      run: docker run -d -p 8000:8000 --name lstm-container lstm-inference

    - name: Wait for Server
      run: |
        timeout 30s bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 1; done'

    - name: Test Root Endpoint
      run: curl -f http://localhost:8000/

    - name: Test Benchmark (CPU Fallback)
      run: curl -f -X POST http://localhost:8000/benchmark
